services:
  postgres:
    image: postgres:17-alpine
    container_name: massage-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: massage
      POSTGRES_PASSWORD: massage
      POSTGRES_DB: massage_booking
    ports:
      - "5433:5432"
    volumes:
      - massage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massage -d massage_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  massage-pgdata:
